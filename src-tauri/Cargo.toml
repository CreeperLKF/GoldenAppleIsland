[package]
name = "claude-hook-guard"
version = "0.1.0"
description = "Claude Hook Guard - system tray approval UI for Claude Code hooks"
edition = "2021"
rust-version = "1.77"

[lib]
name = "claude_hook_guard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "claude-hook-guard"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
dashmap = "6"
log = "0.4"
env_logger = "0.11"
dirs = "5"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
