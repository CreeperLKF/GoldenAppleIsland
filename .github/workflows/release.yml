name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend deps
        run: npm ci

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build Tauri app (msi + nsis)
        run: npm run tauri:build

      - name: Bundle WSL distribution
        run: npm run bundle:wsl

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          cp src-tauri/target/release/bundle/msi/*.msi artifacts/ || true
          cp src-tauri/target/release/bundle/nsis/*.exe artifacts/ || true
          cp dist-wsl/*.tar.gz artifacts/ || true
          ls -la artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: golden-apple-island-${{ github.ref_name }}
          path: artifacts/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
